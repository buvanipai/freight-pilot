# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: freightpilot
      POSTGRES_USER: freightpilot
      POSTGRES_PASSWORD: freightpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightpilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://freightpilot:freightpilot@postgres:5432/freightpilot
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"

  producer:
    build: .
    command: sh -c "python db/schema_apply.py && python -m producer.main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://freightpilot:freightpilot@postgres:5432/freightpilot
      REDIS_URL: redis://redis:6379
      REDIS_CLUSTER: "false"
    restart: on-failure

  consumer:
    build: .
    command: sh -c "python db/schema_apply.py && python -m consumer.main"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://freightpilot:freightpilot@postgres:5432/freightpilot
      REDIS_URL: redis://redis:6379
      REDIS_CLUSTER: "false"
    restart: on-failure

volumes:
  pgdata:

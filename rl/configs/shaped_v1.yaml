name: ppo_shaped_v1

reward:
  type: shaped_v1
  overrun_weight:      0.5     # penalty per hour of ETA overrun
  cost_weight:         0.0001  # penalty per USD of reroute cost (too weak — causes hacking)
  uncertainty_weight:  0.1     # penalty per hour of MAPIE interval width
  on_time_bonus:       5.0
  late_penalty:        3.0

train:
  n_envs:           4
  n_steps:          512
  batch_size:       64
  n_epochs:         10
  gamma:            0.99
  learning_rate:    0.0003
  total_timesteps:  200000
